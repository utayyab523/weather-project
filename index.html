<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Weather APP - See the weather today.</title>
</head>
<body>
    <header>
        <div class="main-header">
            <div class="header">
                <div class="logo">
                    <h2><a href="index.html">Weather App </a></h2>
                </div>
            </div>
            <div class="mobile-menu-icon hidden">
                <div class="open">⁜</div>
                <div class="close hide">※</div>
            </div>
            <div class="menu menu-hidden">
                <ul>
                    <li>
                        <a href="/">Home</a>
                    </li>
                    <li>
                        <a href="about.html">About Us</a>
                    </li>
                </ul>
            </div>
        </div>
    </header>
    <main>
        <section>
            <div class="main-container">
                <div class="form-container">
                    <div class="form-heading">
                        <h1>Weather Today</h1>
                    </div>
                    <div class="form">
                        <form action="">
                            <input type="text" class="search-weather" placeholder="Enter city for weather">
                            <button type="submit" class="search-btn">Search</button>
                        </form>
                    </div>
                </div>
                <div class="data">
                    Here You can see weather Today.
                    
                </div>
            </div>
        </section>
    </main>
    <footer>
        <div class="main-footer">
            <div class="logo">
                <h2><a href="/">Weather App </a></h2>
            </div>
            <div class="links-containr">
                <div class="link">
                    <ul>
                        <li>
                            <a href="/">Home</a>
                        </li>
                        <li>
                            <a href="about.html">About Us</a>
                        </li>
                    </ul>

                </div>
            </div>
        </div>
    </footer>
    <script src="app.js"></script>
    <script src="src/script.js"></script>
</body>
</html>
